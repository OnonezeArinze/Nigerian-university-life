<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nigerian University Life</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a12;
            color: white;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .logo {
            text-align: center;
            font-size: 55px;
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #b7c9bf;
            line-height: 1.5;
        }

        .card {
            background: #10291e;
            padding: 25px;
            border-radius: 22px;
            margin-top: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #263c32;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #ff8a8a;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<!-- WELCOME SCREEN -->

<div id="welcomeScreen" class="screen">

    <div class="container">

        <div class="logo">🎓</div>

        <h1>Nigerian University Life</h1>

        <p class="subtitle">
            Study. Hustle. Make friends.
            Build your future.
        </p>

        <div class="card">

            <h2>Start Your University Journey</h2>

            <p>
                Create your student and experience
                university life your way.
            </p>

            <button onclick="showCreateStudent()">
                Create Student
            </button>

        </div>

    </div>

</div>


<!-- CREATE STUDENT SCREEN -->

<div id="createScreen" class="screen hidden">

    <div class="container">

        <div class="logo">🎓</div>

        <h1>Create Your Student</h1>

        <p class="subtitle">
            Tell us a little about yourself.
        </p>

        <div class="card">

            <label>Student Name</label>

            <input
                id="studentName"
                type="text"
                placeholder="Enter your name"
            >

            <label>Age</label>

            <input
                id="studentAge"
                type="number"
                placeholder="Enter your age"
                min="15"
                max="60"
            >

            <label>Gender</label>

            <select id="studentGender">

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>

            <label>Faculty</label>

            <select id="studentFaculty">

                <option value="">
                    Select faculty
                </option>

                <option>
                    Social Sciences
                </option>

                <option>
                    Management Sciences
                </option>

                <option>
                    Engineering
                </option>

                <option>
                    Sciences
                </option>

                <option>
                    Humanities
                </option>

                <option>
                    Law
                </option>

                <option>
                    Medicine
                </option>

            </select>

            <label>Level</label>

            <select id="studentLevel">

                <option value="">
                    Select level
                </option>

                <option>100 Level</option>
                <option>200 Level</option>
                <option>300 Level</option>
                <option>400 Level</option>
                <option>500 Level</option>

            </select>

            <div id="errorMessage" class="error"></div>

            <button onclick="createStudent()">
                Start University Life
            </button>

        </div>

    </div>

</div>


<script>

function showCreateStudent() {

    document
        .getElementById("welcomeScreen")
        .classList
        .add("hidden");

    document
        .getElementById("createScreen")
        .classList
        .remove("hidden");

}


function createStudent() {

    const name =
        document.getElementById("studentName").value;

    const age =
        document.getElementById("studentAge").value;

    const gender =
        document.getElementById("studentGender").value;

    const faculty =
        document.getElementById("studentFaculty").value;

    const level =
        document.getElementById("studentLevel").value;


    if (
        name === "" ||
        age === "" ||
        gender === "" ||
        faculty === "" ||
        level === ""
    ) {

        document
            .getElementById("errorMessage")
            .innerText =
            "Please complete all the information.";

        return;

    }


    localStorage.setItem(
        "studentName",
        name
    );

    localStorage.setItem(
        "studentAge",
        age
    );

    localStorage.setItem(
        "studentGender",
        gender
    );

    localStorage.setItem(
        "studentFaculty",
        faculty
    );

    localStorage.setItem(
        "studentLevel",
        level
    );


    alert(
        "Welcome to Nigerian University Life, "
        + name
        + "!"
    );

}

</script>

</body>
</html>
