<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nigerian University Life</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071a12;
    color: white;
}

.screen {
    min-height: 100vh;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
}

.logo {
    text-align: center;
    font-size: 50px;
}

h1 {
    text-align: center;
    margin: 10px 0;
}

.subtitle {
    text-align: center;
    color: #b7c9bf;
}

.card {
    background: #10291e;
    padding: 20px;
    border-radius: 20px;
    margin-top: 20px;
}

.stat {
    background: #1b3829;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
}

.stat-title {
    color: #b7c9bf;
    font-size: 14px;
}

.stat-value {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<!-- CREATE STUDENT -->

<div id="createScreen" class="screen">

<div class="container">

<div class="logo">🎓</div>

<h1>Nigerian University Life</h1>

<p class="subtitle">
Create your student and begin your university journey.
</p>

<div class="card">

<label>Student Name</label>

<input
id="studentName"
type="text"
placeholder="Enter your name"
style="width:100%;padding:14px;border-radius:10px;border:none;margin-top:8px;"
>

<label style="display:block;margin-top:15px;">
Age
</label>

<input
id="studentAge"
type="number"
placeholder="Enter your age"
style="width:100%;padding:14px;border-radius:10px;border:none;margin-top:8px;"
>

<label style="display:block;margin-top:15px;">
Gender
</label>

<select
id="studentGender"
style="width:100%;padding:14px;border-radius:10px;border:none;margin-top:8px;"
>

<option value="">Select gender</option>
<option>Male</option>
<option>Female</option>

</select>

<label style="display:block;margin-top:15px;">
Faculty
</label>

<select
id="studentFaculty"
style="width:100%;padding:14px;border-radius:10px;border:none;margin-top:8px;"
>

<option value="">Select faculty</option>
<option>Social Sciences</option>
<option>Management Sciences</option>
<option>Engineering</option>
<option>Sciences</option>
<option>Humanities</option>
<option>Law</option>
<option>Medicine</option>

</select>

<label style="display:block;margin-top:15px;">
Level
</label>

<select
id="studentLevel"
style="width:100%;padding:14px;border-radius:10px;border:none;margin-top:8px;"
>

<option value="">Select level</option>
<option>100 Level</option>
<option>200 Level</option>
<option>300 Level</option>
<option>400 Level</option>
<option>500 Level</option>

</select>

<button onclick="startGame()">
Start University Life
</button>

</div>

</div>

</div>


<!-- DASHBOARD -->

<div id="dashboardScreen" class="screen hidden">

<div class="container">

<div class="logo">🎓</div>

<h1 id="welcomeName">
Welcome!
</h1>

<p class="subtitle">
Your University Dashboard
</p>


<div class="card">

<h2>Student Profile</h2>

<div class="stat">

<div class="stat-title">
Faculty
</div>

<div class="stat-value" id="dashFaculty">
</div>

</div>


<div class="stat">

<div class="stat-title">
Level
</div>

<div class="stat-value" id="dashLevel">
</div>

</div>

</div>


<div class="card">

<h2>Your Stats</h2>

<div class="stat">

<div class="stat-title">
💰 Money
</div>

<div class="stat-value">
₦50,000
</div>

</div>


<div class="stat">

<div class="stat-title">
❤️ Health
</div>

<div class="stat-value">
100%
</div>

</div>


<div class="stat">

<div class="stat-title">
⚡ Energy
</div>

<div class="stat-value">
100%
</div>

</div>


<div class="stat">

<div class="stat-title">
😊 Happiness
</div>

<div class="stat-value">
80%
</div>

</div>


<div class="stat">

<div class="stat-title">
📚 GPA
</div>

<div class="stat-value">
0.00
</div>

</div>

</div>


<div class="card">

<h2>
What do you want to do?
</h2>

<button>
📚 Study
</button>

<button>
💼 Find a Job
</button>

<button>
🍛 Eat
</button>

<button>
👥 Social Life
</button>

<button>
🏫 Campus
</button>

</div>

</div>

</div>


<script>

function startGame() {

const name =
document.getElementById("studentName").value;

const age =
document.getElementById("studentAge").value;

const gender =
document.getElementById("studentGender").value;

const faculty =
document.getElementById("studentFaculty").value;

const level =
document.getElementById("studentLevel").value;


if (
name === "" ||
age === "" ||
gender === "" ||
faculty === "" ||
level === ""
) {

alert("Please complete all the information.");

return;

}


localStorage.setItem("studentName", name);

localStorage.setItem("studentAge", age);

localStorage.setItem("studentGender", gender);

localStorage.setItem("studentFaculty", faculty);

localStorage.setItem("studentLevel", level);


document.getElementById("welcomeName").innerText =
"Welcome, " + name + "!";


document.getElementById("dashFaculty").innerText =
faculty;


document.getElementById("dashLevel").innerText =
level;


document
.getElementById("createScreen")
.classList
.add("hidden");


document
.getElementById("dashboardScreen")
.classList
.remove("hidden");

}

</script>

</body>

</html>
