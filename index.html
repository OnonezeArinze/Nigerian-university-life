<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nigerian University Life</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a12;
            color: white;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }

        .content {
            width: 100%;
            max-width: 500px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 38px;
            margin: 5px 0;
        }

        .subtitle {
            color: #b7c9bf;
            font-size: 17px;
            line-height: 1.5;
        }

        .card {
            background: #10291e;
            padding: 25px;
            margin-top: 30px;
            border-radius: 22px;
        }

        .card h2 {
            margin-top: 0;
        }

        .card p {
            color: #b7c9bf;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .start {
            background: #22c55e;
            color: white;
        }

        .login {
            background: #263c32;
            color: white;
        }

        .footer {
            margin-top: 25px;
            color: #789487;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="content">

            <div class="logo">🎓</div>

            <h1>Nigerian University Life</h1>

            <p class="subtitle">
                Study. Hustle. Make friends.
                Build your future.
            </p>

            <div class="card">

                <h2>Start Your University Journey</h2>

                <p>
                    Create your student and experience
                    university life your way.
                </p>

                <button class="start">
                    Create Student
                </button>

                <button class="login">
                    Continue Game
                </button>

            </div>

            <div class="footer">
                Nigerian University Life © 2026
            </div>

        </div>

    </div>

</body>
</html>
